<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <header>
        <h2>Gestion des Professeurs</h2>
    </header>

    <main>
        <div>
            <a th:href="@{/professeurs/new}"><button class="bouton">Ajouter un professeur</button></a>
        </div>
        <table>
                <thead>
                    <tr>
                        <th scope="col">Nom</th>
                        <th scope="col">Prenom</th>
                    </tr>
                </thead>
                <tbody th:each="modelP :${models} ">
                    <th scope="row"> <p th:text="${modelP.nom}"></p></th>
                    <td><p th:text="${modelP.prenom}"></p></td>
                    <td><a th:href="@{/professeurs/{id}(id=${modelP.id})}"><button>Details</button></a></td>
                    <td><a th:href="@{/professeurs/{id}/modifier(id=${modelP.id})}"><button>Modifier</button></a></td>
                    <td><a th:href="@{/professeurs/{id}/delete(id=${modelP.id})}"><button>Delete</button></a></td>
                </tbody>
        </table>
        <div>
            <a th:href="@{/classes/}"><button>Liste classes</button></a>
        </div>





    </main>

</body>
</html>
